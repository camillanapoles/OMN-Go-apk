# local/skills/manifest.yml — catálogo de skills dos agentes (fonte da verdade)
#
# Governança: openspec/changes/audit-skills-harness/ (issue #30).
# Rotina de uso: docs/RUNBOOK.md, seção "Agent skills".
# Gate executável: backend/internal/repocheck/agent_skills_test.go.
#
# Campos de cada entrada:
#   id        nome da skill (único; vira .claude/skills/<id>/ no install).
#   source    tool:<ferramenta> ou <owner>/<repo> do GitHub.
#   pin       SHA completo do commit (40 hex) ou versão da ferramenta (X.Y.Z).
#   path      caminho do SKILL.md na fonte. Árvore local = local/skills/<id>/SKILL.md.
#   status    global | inactive | rejected. Decisão explícita. Zero vazio.
#   reason    motivo da decisão (obrigatório em global).
#   applies_to domínios sugeridos (dom:* das specs) ou all/none.
#
# Regras fixas:
#   - Toda entrada carrega source + pin + status + reason.
#   - Fonte terceira nunca é vendorada em local/skills/. Só o manifest cita.
#     O install.sh baixa no pin declarado (clone raso + checkout).
#   - Toda skill nova entra INATIVA com origem + pin + motivo e passa por
#     auditoria contra CLAUDE.md §1 antes de virar global (fluxo de 3 passos
#     em docs/AUDIT_PROMPT.md, FASE S.3).
#   - Nunca ativar o pool inteiro. Seleção por-spec no AGENTS.md da spec.
#
# Revalidação das fontes em 2026-11-20 (antes de instalar):
#   - Os nomes "ecc-guardrails" e "ecc-research-playbook" citados na spec
#     NÃO existem no pin 4adeee6 de affaan-m/ECC. Os equivalentes reais
#     estão registrados abaixo (security-review, deep-research).
#   - chrisbanes/skills no pin edd18ff traz 21 skills (a spec dizia 19).
#     A triagem cobre as 21.
