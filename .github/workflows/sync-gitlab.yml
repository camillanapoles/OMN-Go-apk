# Mirror to GitLab.
#
# SECURITY CHANGE OF THIS FORK. The original workflow pushed every branch
# and every tag to gitlab.com/mvbasov/OMN-Go, the GitLab of the author of
# the original. A fork that runs it hands its own work to that account.
# This version mirrors only when the repository variable
# GITLAB_MIRROR_URL names YOUR OWN GitLab remote, and it mirrors only
# production and staging plus the tags. With no variable the job does
# nothing.
#
# It also needs the secret GITLAB_PAT: a GitLab token with write access
# to that remote. See doc/gitops/SECRETS.md.
name: Mirror to GitLab

on:
  push:
    branches: [main, 'merge/sync-cnmfs']
    tags: ['v*']
  workflow_dispatch:

jobs:
  git-sync:
    if: ${{ vars.GITLAB_MIRROR_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Push staging, production and tags to the GitLab remote
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
          MIRROR_URL: ${{ vars.GITLAB_MIRROR_URL }}
        run: |
          set -euo pipefail
          if [ -z "$GITLAB_PAT" ]; then
            echo "::error::GITLAB_MIRROR_URL is set but the secret GITLAB_PAT is missing. See doc/gitops/SECRETS.md."
            exit 1
          fi
          HOST_PATH="${MIRROR_URL#https://}"
          git remote add gitlab "https://oauth2:${GITLAB_PAT}@${HOST_PATH}"
          git push gitlab \
            "+refs/remotes/origin/merge/sync-cnmfs:refs/heads/merge/sync-cnmfs" \
            "+refs/remotes/origin/main:refs/heads/main"
          git push --tags gitlab
