# Release: the maintainer ships one completed spec with one release.
#
#   completed spec -> gh workflow run Release -f issue=<n> ->
#   spec gate -> tag v<APP_VERSION>-f.N -> Build OMN-Go ->
#   GitHub Release with the humanized changelog
#
# A push to main makes no release. The old trigger tagged at each push,
# and the fork then made one small release per pull request, with notes
# that speak to the reviewer of a commit and not to the person who uses
# the app. The gate proves that the issue of the spec is closed with the
# spec:done label, that the tasks file of the spec holds no open task,
# that each task carries its verification and validation criteria, that
# the three version files agree, and that the humanized changelog of the
# version exists. A red gate publishes nothing.
# See doc/decisions/0031-release-after-a-completed-spec.md and
# local/release/spec-release-gate.sh.
name: Release

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'The issue of the completed spec that this release ships'
        required: true
        type: string

permissions:
  contents: write
  issues: read

jobs:
  release:
    name: Spec gate and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that the release token exists
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [ -z "$FORK_SYNC_TOKEN" ]; then
            echo "::error::FORK_SYNC_TOKEN is not set. The Release workflow cannot push the tag. See doc/gitops/SECRETS.md."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Run the spec gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: bash local/release/spec-release-gate.sh "$ISSUE"

      - name: Compute the next tag
        id: tag
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'APP_VERSION\s*=\s*"\K[^"]+' backend/version.go)
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "This commit is already tagged. Nothing to do."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAX=0
          for ref in $(git ls-remote --tags origin "refs/tags/v${VERSION}-f.*" | awk '{print $2}'); do
            N=${ref##*-f.}
            case "$N" in ''|*[!0-9]*) continue ;; esac
            [ "$N" -gt "$MAX" ] && MAX=$N
          done
          TAG="v${VERSION}-f.$((MAX + 1))"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (app version $VERSION)"

      - name: Create the tag and push it
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$TAG" -m "OMN-Go $TAG"
          git push origin "refs/tags/$TAG"
          {
            echo "## 🏷️ Release $TAG"
            echo ""
            echo "O gate da spec passou. A tag dispara o workflow **Build OMN-Go**, que compila"
            echo "o APK assinado e publica a GitHub Release com o changelog humanizado como notas."
          } >> "$GITHUB_STEP_SUMMARY"
