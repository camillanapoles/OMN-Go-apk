# Fork CI: quality gate plus APK artifacts for the branches of this
# fork. The branch model is the GitOps flow of doc/gitops/README.md:
#
#   cnmfs/*, arena/*   work branches (specs and sessions)
#   omn-go/sync        the mirror of the original (upstream)
#   merge/sync-cnmfs   staging: the merge of the mirror with our work
#   main               production
#
# The workflow builds the ONE Dockerfile of the tree. The older
# Dockerfile.ci of the fork disappeared when the original was merged in,
# and a build of that name then failed at once.
#
# ONE BUILD PER COMMIT. The Decide step of each job stops a build that
# has nothing to do. A push to a branch with an open pull request builds
# nothing: the pull request run is the one build of that commit. A
# commit that one Fork CI run already built and passed builds nothing:
# its tree cannot answer differently. A manual re-run (run_attempt above
# one) always builds. Each job still RUNS and passes with its steps
# skipped, because a required check that never reports blocks the
# merge.
#
# The APK job needs no secret to run. With no KEYSTORE_BASE64 it makes a
# throwaway keystore and prints a warning. The APK is then for tests
# only. See doc/gitops/SECRETS.md for the release keystore.
#
# Job names are stable because the branch rulesets use them as required
# checks: "Quality Gate" and "APK Build".
name: Fork CI

on:
  push:
    branches: [main, dev, 'cnmfs/**', 'arena/**', 'merge/**', 'feat/**', 'fix/**', 'refactor/**', 'chore/**', 'docs/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  # The BuildKit gha cache backend needs the actions domain: write to
  # export cache entries, read to import them. With contents alone it
  # silently skips both phases (post step prints "State not set").
  actions: write

jobs:
  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Decide whether this run must build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          run=true
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo "A re-run attempt always builds."
          elif [ "$EVENT" = "push" ]; then
            OPEN=$(gh pr list --repo camillanapoles/OMN-Go-apk --head "$BRANCH" --state open --json number --jq 'length')
            if [ "$OPEN" != "0" ]; then
              run=false
              echo "An open pull request covers this push. The pull request run is the one build of $HEAD_SHA."
            fi
          fi
          if [ "$run" = "true" ]; then
            DONE=$(gh run list --repo camillanapoles/OMN-Go-apk --commit "$HEAD_SHA" --workflow "Fork CI" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
            if [ "$DONE" != "0" ]; then
              run=false
              echo "A Fork CI run of $HEAD_SHA already passed. The tree did not change, thus the answer cannot change."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.decide.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.decide.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      # The BuildKit gha cache backend reads ACTIONS_CACHE_URL and
      # ACTIONS_RUNTIME_TOKEN. The runner hands those to actions only,
      # so this step exposes them to the plain run steps below.
      - name: Expose the GitHub Actions runtime for the buildx cache
        if: steps.decide.outputs.run == 'true'
        uses: crazy-max/ghaction-github-runtime@v3

      # Only two branches export cache. One full export fills a large
      # part of the 10 GB Actions cache pool. Two or three exports in one
      # increment evict each other, and every build then runs cold.
      - name: Run the quality gate
        if: steps.decide.outputs.run == 'true'
        run: |
          CACHE_TO=""
          if [ "$GITHUB_REF" = "refs/heads/dev" ] || [ "$GITHUB_REF" = "refs/heads/merge/sync-cnmfs" ]; then
            CACHE_TO="--cache-to type=gha,mode=max,scope=omngo-test"
          fi
          set +e
          docker buildx build \
            --target test \
            --progress plain \
            --cache-from type=gha,scope=omngo-test \
            --cache-from type=gha,scope=omngo \
            $CACHE_TO \
            . > build.log 2>&1
          RC=$?
          set -e
          tail -80 build.log
          while IFS= read -r l; do
            m="${l//'%'/'%25'}"; m="${m//$'\r'/'%0D'}"; m="${m//$'\n'/'%0A'}"
            echo "::error::${m}"
          done < <(grep -E "FAIL|panic:|vet:" build.log | grep -v "cannot read" | tail -20)
          while IFS= read -r l; do
            m="${l//'%'/'%25'}"; m="${m//$'\r'/'%0D'}"; m="${m//$'\n'/'%0A'}"
            echo "::error::${m}"
          done < <(grep -E "\.go:[0-9]+:[0-9]+:" build.log | grep -v "cannot read" | tail -15)
          exit $RC

  apk:
    name: APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Decide whether this run must build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          run=true
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo "A re-run attempt always builds."
          elif [ "$EVENT" = "push" ]; then
            OPEN=$(gh pr list --repo camillanapoles/OMN-Go-apk --head "$BRANCH" --state open --json number --jq 'length')
            if [ "$OPEN" != "0" ]; then
              run=false
              echo "An open pull request covers this push. The pull request run is the one build of $HEAD_SHA."
            fi
          fi
          if [ "$run" = "true" ]; then
            DONE=$(gh run list --repo camillanapoles/OMN-Go-apk --commit "$HEAD_SHA" --workflow "Fork CI" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
            if [ "$DONE" != "0" ]; then
              run=false
              echo "A Fork CI run of $HEAD_SHA already passed. The tree did not change, thus the answer cannot change."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.decide.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        if: steps.decide.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      # Same runtime exposure as in the gate job: the gha cache backend
      # of the buildx build below needs the two runtime variables.
      - name: Expose the GitHub Actions runtime for the buildx cache
        if: steps.decide.outputs.run == 'true'
        uses: crazy-max/ghaction-github-runtime@v3

      # The keystore comes from the secret KEYSTORE_BASE64. A fork with
      # no secret still gets a build: the step then makes a throwaway
      # keystore with a password of its own and marks each artifact as
      # test-only in the log. The secret ids of the docker build below
      # match the mounts of the Dockerfile in any case.
      - name: Restore Android keystore
        id: keystore
        if: steps.decide.outputs.run == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/omn-go.keystore"
            echo "throwaway=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 is not set. The APK is signed with a THROWAWAY key and is for tests only. See doc/gitops/SECRETS.md for the release keystore."
            keytool -genkeypair -v \
              -keystore "${RUNNER_TEMP}/omn-go.keystore" \
              -alias "${KEY_ALIAS:-omn-go}" \
              -keyalg RSA -keysize 2048 -validity 1 \
              -storepass forkci-throwaway -keypass forkci-throwaway \
              -dname "CN=OMN-Go Fork CI Throwaway (NOT FOR RELEASE)"
            echo "throwaway=true" >> "$GITHUB_OUTPUT"
          fi

      # Signing material goes in as BuildKit secrets, never as build
      # args. A throwaway keystore brings its own password: the build
      # step then reads the fallback of each expression below.
      #
      # The cache-from of the omngo-test scope lets a build of this job
      # skip each layer that the Quality Gate job of the same run or of
      # an earlier run already made. The export stage runs the gate by
      # design (the Dockerfile copies /gate-passed from the test stage),
      # thus the two jobs of one run share the same test layers.
      - name: Build and export artifacts
        if: steps.decide.outputs.run == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'forkci-throwaway' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'omn-go' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'forkci-throwaway' }}
        # Only two branches export cache (same reason as in the gate).
        run: |
          CACHE_TO=""
          if [ "$GITHUB_REF" = "refs/heads/dev" ] || [ "$GITHUB_REF" = "refs/heads/merge/sync-cnmfs" ]; then
            CACHE_TO="--cache-to type=gha,mode=max,scope=omngo"
          fi
          docker buildx build \
            --target export \
            --output type=local,dest=artifacts \
            --secret id=keystore,src="${RUNNER_TEMP}/omn-go.keystore" \
            --secret id=keystore_password,env=KEYSTORE_PASSWORD \
            --secret id=key_alias,env=KEY_ALIAS \
            --secret id=key_password,env=KEY_PASSWORD \
            --build-arg "OMN_GO_COMMIT=$(git rev-parse HEAD)" \
            --build-arg "OMN_GO_COMMIT_TIME=$(git log -1 --format=%cI)" \
            --cache-from type=gha,scope=omngo \
            --cache-from type=gha,scope=omngo-test \
            $CACHE_TO \
            .
          ls -la artifacts/

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/omn-go.keystore"

      - name: Extract version and branch
        id: version
        if: steps.decide.outputs.run == 'true'
        run: |
          VERSION=$(grep -oP 'APP_VERSION\s*=\s*"\K[^"]+' backend/version.go)
          BRANCH=${GITHUB_REF_NAME//\//-}
          {
            echo "version=$VERSION"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION, sanitized branch: $BRANCH"

      - name: Upload artifacts
        if: steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: omn-go-${{ steps.version.outputs.version }}-${{ steps.version.outputs.branch }}
          path: |
            artifacts/omn-go-*-desktop-*
            artifacts/omn-go-*-release.apk
          if-no-files-found: error
          retention-days: 14

  # The first arrow of the GitOps chain: an arena pull request to
  # cnmfs/dev merges itself once the two builds of this run are green.
  # The label "hold" stops the auto-merge of one pull request on demand.
  #
  # The merge must be made with the PAT secret FORK_SYNC_TOKEN: a merge
  # of GITHUB_TOKEN starts no workflow run and the Promote chain would
  # not follow. The ruleset continuidade-cnmfs-arena sets no merge rule
  # on cnmfs/dev, so the two jobs of this run ARE the gate of the merge.
  merge-arena:
    name: Auto-merge arena PR
    needs: [gate, apk]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      needs.apk.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.base_ref == 'cnmfs/dev' &&
      startsWith(github.head_ref, 'arena/') &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'hold')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check that the merge token exists
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [ -z "$FORK_SYNC_TOKEN" ]; then
            echo "::error::FORK_SYNC_TOKEN is not set. The auto-merge of arena pull requests needs it. See doc/gitops/SECRETS.md."
            exit 1
          fi

      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          STATE=$(gh pr view "$PR" --repo camillanapoles/OMN-Go-apk --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "The pull request is $STATE. Nothing to do."
            exit 0
          fi
          HEAD_NOW=$(gh pr view "$PR" --repo camillanapoles/OMN-Go-apk --json headRefOid --jq .headRefOid)
          if [ "$HEAD_NOW" != "$EXPECTED_SHA" ]; then
            echo "The head moved on. The run of $HEAD_NOW is the one that merges."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if gh pr merge "$PR" --merge --repo camillanapoles/OMN-Go-apk; then
              echo "Pull request #$PR merged. Promote takes the chain from here."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::The merge of pull request #$PR did not go through. Merge it by hand."
          exit 1
