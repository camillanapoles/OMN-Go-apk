# Fork CI: quality gate plus unsigned-for-release APK artifacts for the
# fork branches (main, dev, feat/*, fix/*, refactor/*, chore/*, docs/*).
# master stays the upstream mirror and is covered by test.yml instead.
# Job names are stable because branch protection uses them as required
# checks: "Quality Gate" and "APK Build".
name: Fork CI

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'refactor/**', 'chore/**', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The BuildKit gha cache backend needs the actions domain: write to
  # export cache entries, read to import them. With contents alone it
  # silently skips both phases (post step prints "State not set").
  actions: write

jobs:
  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The BuildKit gha cache backend reads ACTIONS_CACHE_URL and
      # ACTIONS_RUNTIME_TOKEN. The runner hands those to actions only,
      # so this step exposes them to the plain run steps below.
      - name: Expose the GitHub Actions runtime for the buildx cache
        uses: crazy-max/ghaction-github-runtime@v3

      # Only the dev branch exports cache. One full export fills a large
      # part of the 10 GB Actions cache pool. Two or three exports in one
      # increment evict each other, and every build then runs cold.
      - name: Run the quality gate
        run: |
          CACHE_TO=""
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            CACHE_TO="--cache-to type=gha,mode=max,scope=omngo-test"
          fi
          docker buildx build \
            -f Dockerfile.ci \
            --target test \
            --progress plain \
            --cache-from type=gha,scope=omngo-test \
            $CACHE_TO \
            .

  apk:
    name: APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Decode the keystore to RUNNER_TEMP, outside the checkout, so the
      # Docker build context never captures it. The build reads it only
      # as a BuildKit secret (id=keystore).
      # Same runtime exposure as in the gate job: the gha cache backend
      # of the buildx build below needs the two runtime variables.
      - name: Expose the GitHub Actions runtime for the buildx cache
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Restore Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/omn-go.keystore"

      # Signing material goes in as BuildKit secrets, never as build
      # args. The secret ids match the mounts of Dockerfile.ci.
      - name: Build and export artifacts
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Only the dev branch exports cache (same reason as in the gate).
        run: |
          CACHE_TO=""
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            CACHE_TO="--cache-to type=gha,mode=max,scope=omngo"
          fi
          docker buildx build \
            -f Dockerfile.ci \
            --target export \
            --output type=local,dest=artifacts \
            --secret id=keystore,src="${RUNNER_TEMP}/omn-go.keystore" \
            --secret id=keystore_password,env=KEYSTORE_PASSWORD \
            --secret id=key_alias,env=KEY_ALIAS \
            --secret id=key_password,env=KEY_PASSWORD \
            --cache-from type=gha,scope=omngo \
            $CACHE_TO \
            .
          ls -la artifacts/

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/omn-go.keystore"

      - name: Extract version and branch
        id: version
        run: |
          VERSION=$(grep -oP 'APP_VERSION\s*=\s*"\K[^"]+' backend/version.go)
          BRANCH=${GITHUB_REF_NAME//\//-}
          {
            echo "version=$VERSION"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION, sanitized branch: $BRANCH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omn-go-${{ steps.version.outputs.version }}-${{ steps.version.outputs.branch }}
          path: |
            artifacts/omn-go-*-desktop-*
            artifacts/omn-go-*-release.apk
          if-no-files-found: error
          retention-days: 14
