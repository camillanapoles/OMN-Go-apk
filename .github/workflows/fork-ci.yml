# Fork CI: quality gate plus unsigned-for-release APK artifacts for the
# fork branches (main, dev, feat/*, fix/*, refactor/*, chore/*, docs/*).
# master stays the upstream mirror and is covered by test.yml instead.
# Job names are stable because branch protection uses them as required
# checks: "Quality Gate" and "APK Build".
name: Fork CI

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'refactor/**', 'chore/**', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run the quality gate
        run: |
          docker buildx build \
            -f Dockerfile.ci \
            --target test \
            --progress plain \
            --cache-from type=gha,scope=omngo-test \
            --cache-to type=gha,mode=max,scope=omngo-test \
            .

  apk:
    name: APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Decode the keystore to RUNNER_TEMP, outside the checkout, so the
      # Docker build context never captures it. The build reads it only
      # as a BuildKit secret (id=keystore).
      - name: Restore Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/omn-go.keystore"

      # Signing material goes in as BuildKit secrets, never as build
      # args. The secret ids match the mounts of Dockerfile.ci.
      - name: Build and export artifacts
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          docker buildx build \
            -f Dockerfile.ci \
            --target export \
            --output type=local,dest=artifacts \
            --secret id=keystore,src="${RUNNER_TEMP}/omn-go.keystore" \
            --secret id=keystore_password,env=KEYSTORE_PASSWORD \
            --secret id=key_alias,env=KEY_ALIAS \
            --secret id=key_password,env=KEY_PASSWORD \
            --cache-from type=gha,scope=omngo \
            --cache-to type=gha,mode=max,scope=omngo \
            .
          ls -la artifacts/

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/omn-go.keystore"

      - name: Extract version and branch
        id: version
        run: |
          VERSION=$(grep -oP 'APP_VERSION\s*=\s*"\K[^"]+' backend/version.go)
          BRANCH=${GITHUB_REF_NAME//\//-}
          {
            echo "version=$VERSION"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION, sanitized branch: $BRANCH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omn-go-${{ steps.version.outputs.version }}-${{ steps.version.outputs.branch }}
          path: |
            artifacts/omn-go-*-desktop-*
            artifacts/omn-go-*-release.apk
          if-no-files-found: error
          retention-days: 14
