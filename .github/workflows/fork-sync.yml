# Fork Sync: make omn-go/sync identical to upstream mvbasov/OMN-Go
# master, then land the mirror into merge/sync-cnmfs (staging) through a
# pull request with auto-merge. This is the "update" step of the GitOps
# flow in doc/gitops/README.md.
#
# The mirror rule is strict: omn-go/sync is a fast-forward copy of the
# original. A divergence (commits of ours on the mirror) fails the job,
# and a human repairs it. The ruleset "espelho-omn-go-sync" keeps the
# same promise from the other side.
#
# A push made by GITHUB_TOKEN starts no workflow run, and the required
# checks of the staging pull request would then never arrive. Every git
# push and every gh command here thus uses the PAT secret
# FORK_SYNC_TOKEN. With no token the job warns and stops. See
# doc/gitops/SECRETS.md.
name: Fork Sync

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check that the sync token exists
        id: token
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [ -n "$FORK_SYNC_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FORK_SYNC_TOKEN is not set. The automatic sync cannot run. See doc/gitops/SECRETS.md. A manual git sync of omn-go/sync still works."
          fi

      - name: Checkout the mirror
        if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: omn-go/sync
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Fast-forward omn-go/sync and open the staging pull request
        if: steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/mvbasov/OMN-Go.git
          git fetch upstream master

          git config user.name "fork-sync[bot]"
          git config user.email "action@github.com"

          DIVERGED=$(git rev-list --count upstream/master..omn-go/sync)
          if [ "$DIVERGED" -ne 0 ]; then
            echo "::error::omn-go/sync has $DIVERGED commit(s) that upstream/master has not. The mirror must be identical to the original. Repair it by hand."
            exit 1
          fi

          BEHIND=$(git rev-list --count omn-go/sync..upstream/master)
          if [ "$BEHIND" -eq 0 ]; then
            echo "omn-go/sync is up to date with upstream. Nothing to sync."
            exit 0
          fi
          echo "omn-go/sync is $BEHIND commit(s) behind upstream/master."

          git merge --ff-only upstream/master
          git push origin omn-go/sync

          PR=$(gh pr list --repo camillanapoles/OMN-Go-apk \
            --base merge/sync-cnmfs --head omn-go/sync --state open \
            --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            PR=$(gh pr create --repo camillanapoles/OMN-Go-apk \
              --base merge/sync-cnmfs --head omn-go/sync \
              --title "Sync upstream into staging" \
              --body "Automated sync of upstream mvbasov/OMN-Go master into merge/sync-cnmfs (staging). Opened by the fork-sync workflow.")
          fi
          gh pr merge "$PR" --auto --merge --repo camillanapoles/OMN-Go-apk
