          files: |
            artifacts/omn-go-*-desktop-*
            artifacts/omn-go-*-release.apk
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
